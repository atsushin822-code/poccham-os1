# OHD Bridge GitHub Actions workflows - テキストファイル版
# このファイルは3つのワークフローを連結したものです。分割ファイルもDriveにあります。
# 使い方: .github/workflows/ にそれぞれ保存して push してください。


===== FILE: build-iso-data.yml =====

# 軽量データISO (77MB/220MB) を GitHub Actions で再現ビルドするワークフロー
# - live-build不要、genisoimage/xorrisoだけで 1分で完了
# - 成果物: ohd-bridge-poc-M16-M19.iso (77MB, 非ブート) と ohd-daily-setup.iso (220MB)
# - どちらも RockRidge+Joliet、通常のUbuntuランナーでビルド可
#
name: build-iso-data

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "include/**"
      - "sdk-mock/**"
      - "live-build-daily/**"
      - "scripts/**"
      - ".github/workflows/build-iso-data.yml"
  pull_request:

permissions:
  contents: read

jobs:
  data-iso:
    name: data-iso (genisoimage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage xorriso

      - name: Build data ISOs
        run: |
          set -eux
          # リポジトリに scripts/create-iso.sh がある想定。
          # 無ければ簡易ステージングでISOを生成
          if [ -x scripts/create-iso.sh ]; then
            bash scripts/create-iso.sh
          else
            # Fallback: リポジトリ直下をそのままISO化 (例)
            STAGE=/tmp/iso-stage
            mkdir -p "$STAGE"
            rsync -a --exclude=.git --exclude=build --exclude=out ./ "$STAGE"/ohd-bridge-poc/
            genisoimage -o ohd-bridge-poc-data.iso -V OHD_BRIDGE_DATA -r -J "$STAGE"
            ls -lh *.iso
            sha256sum *.iso | tee SHA256SUMS
          fi
          ls -lh *.iso 2>&1 | head -n 20
          sha256sum *.iso 2>&1 | head -n 20

      - name: Upload ISOs
        uses: actions/upload-artifact@v4
        with:
          name: data-isos
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: warn
          retention-days: 7


===== FILE: build.yml =====

# リポジトリ直下の .github/workflows/build.yml に置いてください。
# リポジトリに必要なのは ohd-bridge-poc.zip と本ファイルの 2 つだけです。
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: ohd-bridge-poc.zip

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Unzipped project root. Keep in sync with the archive's top-level folder.
      SOURCES: build-tree/ohd-bridge-poc

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gcc-release
            cc: gcc
            cxx: g++
            build_type: RelWithDebInfo
            sanitizers: OFF
          - label: gcc-ohos-mock
            cc: gcc
            cxx: g++
            build_type: RelWithDebInfo
            sanitizers: OFF
            # M6: the OpenHarmony backend against sdk-mock (fake Rosen + fake NDK).
            extra: -DOHD_WITH_OHOS=ON
          - label: clang-asan-ubsan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
          - label: clang-asan-ohos
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
            # Sanitised C++ mock + backend: catches leaks/UB in the parts that a
            # device build would run for real.
            extra: -DOHD_WITH_OHOS=ON

    steps:
      - name: Checkout (payload = zip + this workflow)
        uses: actions/checkout@v4

      - name: Verify payload
        run: |
          set -eu
          test -f "$PACKAGE" || { echo "::error::$PACKAGE is missing"; exit 1; }
          ls -l "$PACKAGE"
          unzip -l "$PACKAGE" | tail -n 20

      - name: Unpack sources
        run: |
          set -eu
          rm -rf build-tree
          mkdir -p build-tree
          unzip -q "$PACKAGE" -d build-tree
          test -f "$SOURCES/CMakeLists.txt" \
            || { echo "::error::unexpected archive layout"; find build-tree -maxdepth 2; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # xwayland + libxcb-composite: M5 (tests/run_xwayland.sh). Without these
          # the X11 test is skipped, not failed - so the job stays green either
          # way, but CI is where we want it exercised.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libwayland-dev wayland-protocols libexpat1-dev \
            libxkbcommon-dev \
            xwayland libxcb1-dev libxcb-composite0-dev libx11-dev x11-utils

      - name: Show toolchain
        run: |
          cmake --version | head -n 1
          ${{ matrix.cc }} --version | head -n 1
          pkg-config --modversion wayland-server wayland-client
          pkg-config --modversion xcb xcb-composite x11
          Xwayland -version | head -n 2 || true

      - name: Configure
        working-directory: ${{ env.SOURCES }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DOHD_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            -DOHD_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.extra }}

      - name: Build
        working-directory: ${{ env.SOURCES }}
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        working-directory: ${{ env.SOURCES }}
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Upload test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artefacts-${{ matrix.label }}
          path: |
            ${{ env.SOURCES }}/build/Testing/**/*.log
            ${{ env.SOURCES }}/build/artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload binaries
        if: matrix.sanitizers == 'OFF'
        uses: actions/upload-artifact@v4
        with:
          name: ohd-bridge-${{ matrix.label }}
          path: |
            ${{ env.SOURCES }}/build/ohd-bridge
            ${{ env.SOURCES }}/build/ohd-test-client
          retention-days: 14


===== FILE: live-iso.yml =====

# GitHub Actions で日常用途ブートISO (live-build) をビルドするワークフロー
# - 手元Debian不要、GitHubのUbuntuランナーで完結
# - trixie (Debian13) のXfce+Firefox+日本語+OHD Bridge入り hybrid ISO (UEFI/BIOS) を生成
# - ビルド時間 30-60分、成果物 2.5GB前後
#
# 置き場所: .github/workflows/live-iso.yml
# 同梱必須: live-build-daily.tar.gz または live-build-daily/ ディレクトリ
#   (本リポジトリでは live-build-daily.tar.gz を推奨: 984KB)
#
name: live-iso

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "live-build-daily/**"
      - "live-build-daily.tar.gz"
      - ".github/workflows/live-iso.yml"
  pull_request:
    paths:
      - "live-build-daily/**"
      - "live-build-daily.tar.gz"
      - ".github/workflows/live-iso.yml"
  schedule:
    # 毎週月曜 03:00 JST (日曜18:00 UTC) に定期ビルドでDebian更新を取り込む
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: live-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-iso:
    name: live-iso (debian trixie Xfce daily)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show payload
        run: |
          ls -lh live-build-daily.tar.gz live-build-daily 2>&1 | head -n 40
          du -sh . 2>&1 | head

      - name: Unpack live-build config
        run: |
          set -eux
          if [ -f live-build-daily.tar.gz ]; then
            tar tzf live-build-daily.tar.gz | head -n 20
            tar xzf live-build-daily.tar.gz
            # tar は live-ohd/ を作る。後続は live-ohd で統一
            ls -l live-ohd/config/package-lists/ || ls -l live-build-daily/config/package-lists/
            if [ ! -d live-ohd ]; then
              mv live-build-daily live-ohd
            fi
          elif [ -d live-build-daily/config ]; then
            # 直接ディレクトリがコミットされている場合
            rm -rf live-ohd
            cp -a live-build-daily live-ohd
          else
            echo "::error::live-build-daily.tar.gz も live-build-daily/ も見つかりません"
            exit 1
          fi
          ls -lh live-ohd/config/package-lists/
          cat live-ohd/config/package-lists/*.list.chroot

      - name: Install live-build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools \
            xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            curl ca-certificates

      - name: Show host
        run: |
          live-build --version || lb --version || true
          mksquashfs -version 2>&1 | head -n 5
          debootstrap --version 2>&1 | head -n 5
          xorriso -version 2>&1 | head -n 10
          df -h

      - name: Build ISO (lb build)
        working-directory: live-ohd
        run: |
          set -eux
          df -h
          # live-build は root 権限が必要。tee でログを残す
          sudo lb build 2>&1 | tee build.log
          echo "=== BUILD DONE ==="
          ls -lh *.iso *.img 2>&1 | head -n 20
          sha256sum *.iso | tee SHA256SUMS
          cat SHA256SUMS

      - name: Check ISO is bootable
        working-directory: live-ohd
        run: |
          set -eux
          ISO=$(ls -1 *.iso | head -n1)
          echo "ISO=$ISO"
          # isohybrid + UEFI/BIOS 両対応かを確認
          isohybrid --help 2>&1 | head -n 5 || true
          xorriso -indev "$ISO" -toc 2>&1 | head -n 40 || true
          # xorriso / isoinfo でブートカタログ有無
          xorriso -report_el_torito plain -indev "$ISO" 2>&1 | head -n 80 || true
          fdisk -l "$ISO" 2>&1 | head -n 40 || true

      - name: Split if huge (Drive 100MB対策の参考)
        working-directory: live-ohd
        run: |
          set -eux
          ISO=$(ls -1 *.iso | head -n1)
          ls -lh "$ISO"
          # 2GB超でも Artifact は上げられるが、ログ用にサイズだけ出す
          du -h "$ISO"
          wc -c "$ISO"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-image-amd64-hybrid-iso
          path: |
            live-ohd/*.iso
            live-ohd/SHA256SUMS
            live-ohd/build.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build.log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-log
          path: |
            live-ohd/build.log
            live-ohd/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7


===== FILE: README_ACTIONS.md =====

# GitHub Actions 使い方

## 1. 既存CI (build.yml)
- `ohd-bridge-poc.zip` を解凍して `gcc/clang×ohos有無×sanitizer` の4マトリクスで `ctest`。
- 何もしなくても push/PR で走る。成果物は headless の ppm と summary.json。

## 2. 日常ブートISO (live-iso.yml) ★今回追加
- **手元にDebianが無くても** Ubuntuランナーで `live-build` して 2.5GB hybrid ISOを生成。
- トリガー: 手動 `Run workflow` / `live-build-daily/**` 変更時 / 毎週月曜定期。
- 成果物: `live-image-amd64-hybrid-iso` (ISO+SHA256+build.log, 14日保持)。
- USB書き込み: `sudo dd if=live-image-amd64.hybrid.iso of=/dev/sdX bs=4M status=progress`
- UEFI/BIOS両対応、Xfce+Firefox+fcitx5-mozc+開発一式+OHD Bridge入。

### 手動実行
Actions → `live-iso` → `Run workflow` → 緑になったら Artifacts からDL。

### なぜ定期ビルド？
Debian trixie のセキュリティ更新を毎週取り込むため。手動でもいつでも再ビルド可。

## 3. 軽量データISO (build-iso-data.yml)
- `genisoimage`だけで77MB/220MBの非ブートISOを1分で生成。live-build不要。
- こちらは通常CIの延長で回せる。

## よくある質問
- **Q: ランナーの空きは足りる？** A: ubuntu-24.04は14GB空き。live-buildの展開3GBとISO2.5GBで足りる。
- **Q: 2.5GBをArtifactに上げられる？** A: 上げられる (上限はリポジトリで10GB程度)。分割不要。
- **Q: リリースにしたい** A: `softprops/action-gh-release` を追加すればタグpushでRelease添付可。必要なら追記する。
